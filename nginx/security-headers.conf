# Security headers for every response served by Nginx.
# Included in the server block AND in each location that sets its own add_header: Nginx does not inherit
# add_header directives into a location that defines any add_header of its own.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
# Browsers honour HSTS only over HTTPS, so this is inert until TLS is terminated in front of this server.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
